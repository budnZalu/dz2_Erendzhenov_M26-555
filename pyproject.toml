[project]
name = "primitive_db"
version = "0.6.0"
description = "Учебное консольное приложение для работы с примитивной базой данных"
readme = "README.md"
authors = [
    { name = "Эрендженов (Erendzhenov), M26-555" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

# Совместимость с финальным чек-листом Poetry; uv использует группу выше.
[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.4"
